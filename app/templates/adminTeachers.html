<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Teachers</title>
    <link rel="stylesheet" href="/static/css/adminDashboard.css" />
    <link rel="stylesheet" href="/static/css/adminTeachers.css" />
    <script src="/static/js/adminTeachers.js" defer></script>
  </head>
  <body>
    {% include 'adminSidebar.html' %}

    <main class="main-content">
      <h2 class="welcome">Manage Teachers</h2>
      <button onclick="openModal('addModal')">Add New Teacher</button>

      <table border="1" cellpadding="8" cellspacing="0">
        <thead>
          <tr>
            <th>Teacher ID</th>
            <th>Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for teacher in teachers %}
          <tr>
            <td>{{ teacher.teacher_id }}</td>
            <td>{{ teacher.name }}</td>
            <td>
              <a
                href="javascript:void(0)"
                onclick="openUpdateModal('{{ teacher.teacher_id }}', '{{ teacher.name }}')"
                >Edit</a
              >
              |
              <a
                href="javascript:void(0)"
                class="delete"
                data-id="{{ teacher.teacher_id }}"
                data-name="{{ teacher.name }}"
              >
                Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>

    <!-- Add Modal -->
    <div id="addModal" class="modal">
      <div class="modal-content">
        <h3>Add Teacher</h3>
        <form id="addForm">
          <label>Name:</label>
          <input type="text" name="name" required />

          <label>Course:</label>
          <select name="course_id" id="courseSelect" required>
            <option value="" disabled selected>Select Course</option>
            <optgroup label="Arts">
              <option value="1">B.A.M.M.C.</option>
            </optgroup>
            <optgroup label="Science">
              <option value="2">B.Sc. in Computer Science</option>
              <option value="3">B.Sc. in Information Technology</option>
              <option value="4">B.Sc. in Packaging Technology</option>
              <option value="5">B.Sc. in Environmental Science</option>
              <option value="6">B.Sc. in Data Science</option>
            </optgroup>
            <optgroup label="Commerce">
              <option value="7">B.Com. (Bachelor of Commerce)</option>
              <option value="8">B.Com. (Accounting & Finance)</option>
              <option value="9">B.Com. (Banking & Insurance)</option>
              <option value="10">B.Com. (Financial Markets)</option>
              <option value="11">B.M.S.</option>
              <option value="12">
                B.Com. (Management Accounting with Finance)
              </option>
              <option value="13">B.Com. (Entrepreneurship)</option>
            </optgroup>
            <!-- TODO: Masters courses -->
          </select>

          <div class="modal-actions">
            <button type="submit">Add</button>
            <button type="button" onclick="closeModal('addModal')">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="modal">
      <div class="modal-content">
        <h3>Update Teacher</h3>
        <form id="updateForm">
          <input type="hidden" name="teacher_id" id="update_teacher_id" />
          <label>Name:</label>
          <input type="text" name="name" id="update_name" required />
          <div class="modal-actions">
            <button type="submit">Update</button>
            <button type="button" onclick="closeModal('updateModal')">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <h3>Delete Teacher</h3>
        <p id="deleteTeacherName">
          Are you sure you want to delete this teacher?
        </p>
        <div class="modal-actions">
          <button id="confirmDeleteBtn" style="background-color: #d9534f">
            Yes, Delete
          </button>
          <button type="button" onclick="closeModal('deleteModal')">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
