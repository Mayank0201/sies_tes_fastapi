<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Teachers</title>
    <link rel="stylesheet" href="/static/css/adminDashboard.css">
    <script src="/static/js/adminTeachers.js" defer></script>
</head>
<body>
    {% include 'adminSidebar.html' %}

    <main class="main-content">
        <h2 class="welcome">Manage Teachers</h2>

        <button onclick="openModal('addModal')">Add New Teacher</button>

        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>Teacher ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for teacher in teachers %}
                <tr>
                    <td>{{ teacher.teacher_id }}</td>
                    <td>{{ teacher.name }}</td>
                    <td>
                        <a href="javascript:void(0)" onclick="openUpdateModal('{{ teacher.teacher_id }}', '{{ teacher.name }}')">Edit</a> |
                        <a href="javascript:void(0)" onclick="deleteTeacher('{{ teacher.teacher_id }}')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>Add Teacher</h3>
            <form id="addForm">
                <label>Name:</label>
                <input type="text" name="name" required>
                <div class="modal-actions">
                    <button type="submit">Add</button>
                    <button type="button" onclick="closeModal('addModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="updateModal" class="modal">
        <div class="modal-content">
            <h3>Update Teacher</h3>
            <form id="updateForm">
                <input type="hidden" name="teacher_id" id="update_teacher_id">
                <label>Name:</label>
                <input type="text" name="name" id="update_name" required>
                <div class="modal-actions">
                    <button type="submit">Update</button>
                    <button type="button" onclick="closeModal('updateModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
