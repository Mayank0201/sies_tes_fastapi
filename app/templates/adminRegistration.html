<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Registration</title>
    <link rel="stylesheet" href="/static/css/adminRegistration.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="brand">Admin Registration</h2>

      <form method="POST" action="/adminRegister">
        <div class="form-group">
          <label for="admin_name">Full Name:</label>
          <input type="text" id="admin_name" name="admin_name" required />
        </div>

        <div class="form-group">
          <label for="admin_email">Email:</label>
          <input type="email" id="admin_email" name="admin_email" required />
        </div>

        <div class="form-group">
          <label for="admin_password">Password:</label>
          <input
            type="password"
            id="admin_password"
            name="admin_password"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password:</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          />
        </div>

        <!-- static course dropdown for now -->
        <div class="form-group">
          <label for="course_id">Course:</label>
          <select id="course_id" name="course_id" required>
            <option value="" disabled selected>Select Course</option>

            <!-- UG COURSES -->
            <option value="1">
              B.A.M.M.C. (Bachelor of Arts in Mass Media and Communication)
            </option>

            <option value="2">B.Sc. in Computer Science</option>
            <option value="3">B.Sc. in Information Technology</option>
            <option value="4">B.Sc. in Packaging Technology</option>
            <option value="5">B.Sc. in Environmental Science</option>
            <option value="6">B.Sc. in Data Science</option>

            <option value="7">B.Com. (Bachelor of Commerce)</option>
            <option value="8">B.Com. (Accounting & Finance)</option>
            <option value="9">B.Com. (Banking & Insurance)</option>
            <option value="10">B.Com. (Financial Markets)</option>
            <option value="11">B.M.S. (Bachelor of Management Studies)</option>
            <option value="12">
              B.Com. (Management Accounting with Finance)
            </option>
            <option value="13">B.Com. (Entrepreneurship)</option>

            <!-- TODO: Postgraduate courses -->
            <!--
                    <option value="14">M.Sc. in Computer Science</option>
                    <option value="15">M.Sc. in Information Technology</option>
                    <option value="16">M.Sc. in Environmental Science</option>

                    <option value="17">M.A. in Business Economics</option>
                    <option value="18">M.A. in Journalism and Mass Communication</option>

                    <option value="19">M.Com. (Advanced Accountancy)</option>
                    <option value="20">M.Com. in Business Management</option>
                    -->
          </select>
        </div>

        <button type="submit" class="btn">Register</button>
      </form>

      <div class="login-link">
        <a href="/admin/login-form">Already registered? Login here</a>
      </div>
    </div>

    <!-- dynamic messages from backend -->
    {% if message %}
    <script>
      alert("{{ message }}");
      window.location.href = "/admin/login-form";
    </script>
    {% endif %} {% if error %}
    <script>
      alert("{{ error }}");
    </script>
    {% endif %}
  </body>
</html>
