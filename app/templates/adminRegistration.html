<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration</title>
    <link rel="stylesheet" href="/static/css/adminRegistration.css">
</head>
<body>
    <div class="container">
        <h2 class="brand">Admin Registration</h2>

        <form method="POST" action="/adminRegister">
            <div class="form-group">
                <label for="admin_name">Full Name:</label>
                <input type="text" id="admin_name" name="admin_name" required>
            </div>

            <div class="form-group">
                <label for="admin_email">Email:</label>
                <input type="email" id="admin_email" name="admin_email" required>
            </div>

            <div class="form-group">
                <label for="admin_password">Password:</label>
                <input type="password" id="admin_password" name="admin_password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

        <div class="login-link">
            <a href="/admin/login-form">Already registered? Login here</a>
        </div>
    </div>

    <!-- ✅ Dynamic messages from backend -->
    {% if message %}
    <script>
        alert("{{ message }}");
        window.location.href = "/admin/login-form";  // Redirect to login after success
    </script>
    {% endif %}

    {% if error %}
    <script>
        alert("{{ error }}");
    </script>
    {% endif %}
</body>
</html>
